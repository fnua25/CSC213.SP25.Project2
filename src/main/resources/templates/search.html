<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
</head>
<body>
<h1>🔍 Search Complaints by Company</h1>

<form method="get" action="/search">
    <input type="text" name="company" placeholder="Enter company name..." th:value="${companySearch}" />
    <button type="submit">Search</button>
</form>

<!-- Display error message if any -->
<p th:if="${error != null}" th:text="${error}" style="color: red;"></p>

<!-- Display search results if any -->
<ul th:if="${searchResults != null}">
    <li th:each="complaint : ${searchResults}">
        <strong th:text="'Complaint ID: ' + ${complaint.complaintId}"></strong> —
        <span th:text="${complaint.narrative}"></span>
    </li>
</ul>

<!-- Optionally provide a link back to the viewer -->
<a href="/complaint">Back to Viewer</a>
</body>
</html>
